# Project Config
external-warehouse:
  # name
  name: external-warehouse
  # version
  version: 1.0.0
  # copyrightyear year
  copyrightYear: 2026
  # File Path（ Windows D:/farm/uploadPath，Linux  /home/farm/uploadPath）
  profile: /opt/pms/temp
  # ipアドレス取得スイッチ
  addressEnabled: false
  # 検証コードタイプmath数値計算char文字検証
  captchaType: math
  # cache: redis / db
  cache: db
  # mail Service: awsSes / javamail
  mailSendType: awsSes

# 開発環境の構成
server:
  # サーバのHTTPポート、デフォルトは8080
  port: 9182

# ログ
logging:
  file:
    path: /opt/pms/logs
  level:
    jp.nasta.pms: error
    org.springframework: warn

# Spring
spring:
  datasource:
    url: jdbc:postgresql://xxx:5432/nasta_pms?currentSchema=pms
    username: pms
    password: ZQ34rY8Xw^dL

# AWS
aws:
  # SESメール設定 IAM
  ses:
    # AWSリージョン
    region: ap-northeast-1
    # AWSアクセスキーID
    access-key-id:
    # AWSシークレットアクセスキー
    secret-access-key:
    # 送信者メールアドレス
    from-email: dev-xxx.com
    # メールエンコーディング
    charset: UTF-8
    # LocalStackエンドポイントURL
    endpoint-url:

  # AWS S3ファイルストレージ設定
  s3:
    # AWSリージョン (SESと一致させる)
    region: ap-northeast-1
    # AWSアクセスキーID
    access-key-id:
    # AWSシークレットアクセスキー
    secret-access-key:
    # バケット名
    bucket-name: dev-yamagata-agrisup
    # ファイル保存パスプレフィックス
    path-prefix: uploads/
    # ファイルアクセスURLプレフィックス (ファイルアクセスリンクの生成に使用)
    url-prefix: