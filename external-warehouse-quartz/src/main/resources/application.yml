# Project Config
external-warehouse:
  # name
  name: CRM-Quartz
  # version
  version: 1.0.0
  # copyrightyear year
  copyrightYear: 2026
  # cache: redis / db
  cache: db
  # File Path（ Windows D:/farm/uploadPath，Linux  /home/farm/uploadPath）
  profile: ./uploads
  # ipアドレス取得スイッチ
  addressEnabled: false
  # 検証コードタイプmath数値計算char文字検証
  captchaType: math
  # 暗号化に使用する秘密鍵（16バイト）
  decryptFieldKey: 59KDbersTvuTdyh8uklt158e9utyh9s7
  # 初期化ベクトル（IV、16バイト）
  decryptFieldIv: q3KanypB7RB5Rqom32tdzyaecgeq938u
  # ホワイトURLリスト
  whiteUrlList:
    - /crm/organization/**
    - /api/simulation/get/raku/token
    - /api/simulation/get/raku/orderList
    - /api/simulation/getOrderList

# 開発環境の構成
server:
  # サーバのHTTPポート、デフォルトは8281
  port: 8681
  servlet:
    # 適用されるアクセスパス
    context-path: /
  tomcat:
    # tomcat URI
    uri-encoding: UTF-8
    # 接続数がいっぱいになった後のキュー数、デフォルトは100
    accept-count: 1000
    threads:
      # tomcatの最大スレッド数、デフォルトは200
      max: 800
      # Tomcat初期化を開始するスレッド数、デフォルト値10
      min-spare: 100

# ログ
logging:
  file:
    path: ./logs/quartz
  level:
    jp.newpart: debug
    org.springframework: warn

# ユーザー
user:
  password:
    # パスワードの最大エラー数
    maxRetryCount: 5
    # パスワードロック時間（デフォルト10分）
    lockTime: 10

# Spring
spring:
  jackson:
    time-zone: "Asia/Tokyo"
    deserialization:
      fail-on-unknown-properties: false
  # リソース情報
  messages:
    # 国際化リソースファイルパス
    basename: i18n/messages
  profiles:
    active: ${profileActive}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://8.147.128.107:5432/farm_dev?currentSchema=farm
    username: postgres
    password: postgres123$

  # ファイルのアップロード
  servlet:
    multipart:
      # 単一ファイルサイズ
      max-file-size: 10MB
      # アップロード合計ファイルサイズの設定
      max-request-size: 20MB
  # サービスモジュール
  devtools:
    restart:
      # ホットデプロイスイッチ
      enabled: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  data:
    # redis
    redis:
      # HOST
      host:
      # ポート、デフォルトは6379
      port:
      # データベースインデックス
      database: 1
      # パスワード
      password:
      # 接続タイムアウト時間
      timeout: 10s
      lettuce:
        pool:
          # 接続プール内の最小アイドル接続
          min-idle: 0
          # 接続プール内の最大アイドル接続
          max-idle: 8
          # 接続プールのデータベース接続の最大数
          max-active: 8
          # 接続プールの最大ブロック待ち時間（制限なしの負の値を使用）
          max-wait: -1ms
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@qq.com
    password: your-authorization-code
    from-email: your-email@qq.com
    protocol: smtp
    default-encoding: UTF-8
    debug: true
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  quartz:
    job-store-type: jdbc
    properties:
      org:
        quartz:
          scheduler:
            instanceName: quartzScheduler
            instanceId: AUTO
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: QRTZ_
            useProperties: false
            isClustered: true
            clusterCheckinInterval: 20000
            dataSource: quartzDataSource
          dataSource:
            quartzDataSource:
              provider: hikaricp
              driver: ${spring.datasource.driverClassName}
              URL: ${spring.datasource.url}
              user: ${spring.datasource.username}
              password: ${spring.datasource.password}
              maxConnections: 15
              validationQuery: SELECT 1
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true

# token
token:
  # トークンカスタムID
  header: Authorization
  # トークンキー
  secret: abcde13455654rstabtcaste
  # トークン有効期間（デフォルト120分）
  expireTime: 120
  # 一時的トークン有効期間（デフォルト10分）
  tempExpireTime: 10
  # トークン自動更新有効期限
  automaticRenewalTokenMin: 30
  # ログインユーザー cache key
  tokenCacheKey: crm_login_tokens

# MyBatis
mybatis:
  # 指定されたパッケージ別名の検索
  typeAliasesPackage: jp.newpart.**.domain
  # mapperのスキャンを設定して、すべてのmapper.xmlマップファイルを見つける
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # グローバルなプロファイルのロード
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper ページングプラグイン
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# XSS攻撃を防ぐ
xss:
  # フィルタスイッチ
  enabled: true
  # リンクを除外（コンマで区切られた複数）
  excludes: /system/notice
  # 一致リンク
  urlPatterns: /system/*,/monitor/*,/tool/*

# SFTP関連設定
sftp:
  # SFTPサーバーホストアドレス
  host: 172.14.3.40
  # SFTPサーバーポート
  port: 22
  # ユーザー名
  username: ftpshukou
  # パスワード
  password: ScmAy3#w
  # 秘密鍵パス
  privateKeyPath:
  # ファイルパス
  sftp-zip-path: download/
  # ローカルファイルパステンプレート
  local-path-template: temp/
  # 接続タイムアウト（ミリ秒）
  connect-timeout: 10000
  # セッションタイムアウト（ミリ秒）
  session-timeout: 30000

# バッチメール設定
batchEmail:
  # 受信者メールアドレス
  toEmail: yamagata-farm@nextosd.com
  # 抄送者メールアドレス
  ccEmail: null
  # 抄送者メールアドレス
  bccEmail: null
  # メールタイトル
  emailTitle: "【ローカルテスト】"

# AWS SESメール設定
aws:
  ses:
    # AWSリージョン (例: us-east-1, ap-southeast-1)
    region: us-east-1
    # AWSアクセスキーID (LocalStackは任意の値を使用)
    access-key-id: test
    # AWSシークレットアクセスキー (LocalStackは任意の値を使用)
    secret-access-key: test
    # 送信者メールアドレス (LocalStackでは任意のメールアドレスが使用可能)
    from-email: sender@nextosd.com
    # メールエンコーディング
    charset: UTF-8
    # LocalStackエンドポイントURL
    endpoint-url: http://172.14.3.142:4566
  
  # AWS S3ファイルストレージ設定
  s3:
    # AWSリージョン (SESと一致させる)
    region: us-east-1
    # AWSアクセスキーID (LocalStackは任意の値を使用)
    access-key-id: test
    # AWSシークレットアクセスキー (LocalStackは任意の値を使用)
    secret-access-key: test
    # バケット名 (LocalStackでは任意の名前が使用可能)
    bucket-name: my-unencrypted-bucket
    # ファイル保存パスプレフィックス
    path-prefix: uploads/
    # ファイルアクセスURLプレフィックス (ファイルアクセスリンクの生成に使用)
    url-prefix: http://172.14.3.142:4566/my-unencrypted-bucket/
    # LocalStackエンドポイントURL
    endpoint-url: http://172.14.3.142:4566

